name: Windows build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build skate3rust on Windows
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Cache Cargo build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Install LLVM
        shell: powershell
        run: |
          $readobj = Join-Path $env:ProgramFiles 'LLVM/bin/llvm-readobj.exe'
          if (-not (Test-Path -LiteralPath $readobj)) {
            choco install -y llvm --no-progress
            if ($LASTEXITCODE -ne 0) { throw "LLVM install failed" }
          }
          if (-not (Test-Path -LiteralPath $readobj)) { throw "LLVM llvm-readobj.exe was not found" }

      - name: Add LLVM to PATH
        shell: bash
        run: echo "C:/Program Files/LLVM/bin" >> "$GITHUB_PATH"

      - name: Build Windows game
        shell: powershell
        run: |
          .\BUILD.bat

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: skate3rust-windows
          path: |
            bin/
            target/release/skate3rust.exe
            target/release/*.dll
          if-no-files-found: error
